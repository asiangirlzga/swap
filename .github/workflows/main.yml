name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]          # pushing a tag like v1.0 also creates a GitHub Release
  pull_request:
  workflow_dispatch:         # lets you press "Run workflow" manually

permissions:
  contents: write            # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner already ships with the Android SDK (ANDROID_HOME),
      # so no separate SDK setup action is needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoopSwap-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
